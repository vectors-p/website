<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Contact Information</h1>
      <hr />

      <p>
        For official communication ok and inquiries, please use the contact
        details below.
      </p>

      <p>
        <strong>Email:</strong> info@example.com<br />
        <strong>Phone:</strong> +91-XXXXXX754
      </p>

      <p>
        Correspondence is reviewed periodically. Please allow reasonable time
        for a response.
      </p>

      <hr />

      <p>
        <a href="index.html">← Back to Home</a>
      </p>
    </div>

    <footer>
      <button class="mode-toggle" id="modeToggle">Dark</button>
      <span>© 2026 John Doe. All rights reserved.</span>
    </footer>
    <script>
      const toggle = document.getElementById("modeToggle");
      const body = document.body;

      const savedMode = localStorage.getItem("mode");
      if (savedMode === "light") {
        body.classList.add("light-mode");
        toggle.textContent = "Light";
      }

      toggle.addEventListener("click", function () {
        body.classList.toggle("light-mode");

        if (body.classList.contains("light-mode")) {
          toggle.textContent = "Light";
          localStorage.setItem("mode", "light");
        } else {
          toggle.textContent = "Dark";
          localStorage.setItem("mode", "dark");
        }
      });
    </script>
  </body>
</html>
